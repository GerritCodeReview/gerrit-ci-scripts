- project:
    name: events-kafka
    repo: events-kafka
    organization: GerritForge
    extra-modules: 'events-broker'
    jobs:
      - 'plugin-{name}-gh-bazel-{branch}':
          extra-gh-repos: 'gerrit-bsl-license'
          branch:
            - master
            - stable-3.15
            - stable-3.14
            - stable-3.13
      - 'plugin-{name}-verifier'
      - 'plugin-{name}-verifier-gh'
